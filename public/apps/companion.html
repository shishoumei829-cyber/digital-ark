<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>数字方舟陪护端</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Sans SC', sans-serif; background:#e8e4dc; min-height:100vh; display:flex; justify-content:center; padding:28px 16px; }
.phone { width:390px; min-height:844px; background:#fdf9f3; border-radius:50px; overflow:hidden; box-shadow:0 50px 100px rgba(0,0,0,.22), 0 0 0 1px rgba(0,0,0,.06); display:flex; flex-direction:column; position:relative; }
.phone::before { content:''; position:absolute; top:12px; left:50%; transform:translateX(-50%); width:120px; height:34px; background:#111; border-radius:22px; z-index:20; }
.topbar { padding:60px 24px 14px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(198,199,192,.28); background:rgba(253,249,243,.9); z-index:10; }
.topbar-title { font-family:'Noto Serif SC', serif; font-size:18px; font-weight:600; color:#5e5e5c; }
.avatar-sm { width:32px; height:32px; border-radius:50%; overflow:hidden; border:1px solid #d6d3cd; }
.mi { font-family:'Material Symbols Outlined'; font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24; font-size:22px; line-height:1; color:#767872; }
.mi-f { font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24; }
.page { display:none; flex-direction:column; flex:1; overflow-y:auto; }
.page.on { display:flex; }
.pc { padding:0 24px 32px; }
.t-label { font-size:11px; font-weight:600; letter-spacing:.07em; color:#767872; }
.t-body-sm { font-size:13px; line-height:1.55; color:#454742; }
.t-body { font-size:15px; line-height:1.6; color:#1c1c18; }
.t-title { font-family:'Noto Serif SC', serif; font-size:21px; font-weight:600; color:#1c1c18; }
.card-w { background:#fff; border-radius:20px; padding:18px; }
.chip { display:inline-flex; align-items:center; padding:6px 14px; border-radius:99px; font-size:12px; font-weight:600; }
.chip-g { background:#dae2d8; color:#5d655d; }
.chip-o { background:transparent; border:1px solid #c6c7c0; color:#767872; }
.bottom-nav { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; padding:10px 24px 30px; background:rgba(247,243,237,.96); border-top:1px solid rgba(198,199,192,.22); }
.nav-btn { border:0; background:transparent; border-radius:99px; padding:8px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; }
.nav-btn.on { background:#dae2d8; }
.nav-btn.on .mi { color:#596059; font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24; }
.nav-lbl { font-size:10px; font-weight:600; color:#767872; }
.nav-btn.on .nav-lbl { color:#596059; }
@keyframes breathe { 0%,100%{transform:scale(1);opacity:.22} 50%{transform:scale(1.1);opacity:.1} }
.breathing { animation:breathe 8s ease-in-out infinite; }
.module-row { width:100%; display:flex; align-items:center; gap:12px; background:#fff; border:1px solid rgba(198,199,192,.25); border-radius:16px; padding:13px 14px; }
.icon-pill { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#dae2d8; flex-shrink:0; }
.chat-bubble { max-width:82%; padding:12px 14px; border-radius:18px; font-size:14px; line-height:1.55; }
.chat-bubble.ai { align-self:flex-start; background:#fff; color:#1c1c18; border-top-left-radius:6px; }
.chat-bubble.me { align-self:flex-end; background:#596059; color:#fff; border-top-right-radius:6px; }
body.da-desktop .phone::before { display: none; }
</style>
<link rel="stylesheet" href="/js/app-shell.css"/>
</head>
<body>
<div class="phone">
  <header class="topbar">
    <div class="avatar-sm"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuD9CoAWFz6hMRGOhuFmcuf1GHNeVfSH2zLbrtfNdU4txcJclXi6DkYCaPiabLusTHGedU3EHqjNSzSLKEL7CYSvE--n7Mt2-j-72cPi20p5hgWyEUmPgSTsqL_yxGXTSVHpLeSbTwzdqnfEW_gSoUQEg4hv4m8Z2TnmzBebpctdchgCJdYZ-w_h2AcVbzcHPYnotKWOWnaUIaICREgPnS9Og-kq70jW_pn5KNvZkCMymFge4kmsKNRh_Tj3xpG87Qkbno4Tmguh-I7i" style="width:100%;height:100%;object-fit:cover;" alt=""/></div>
    <span class="topbar-title">陪护端<span class="da-avatar-badge" id="daAvatarBadge">数字分身</span></span>
    <span class="mi" style="cursor:pointer;" title="切换应用">apps</span>
  </header>

  <div id="p0" class="page on">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:24px 24px 32px;">
      <div style="position:relative;margin-bottom:28px;">
        <div class="breathing" style="position:absolute;inset:-28px;background:rgba(193,201,191,.22);border-radius:50%;filter:blur(32px);"></div>
        <div style="width:210px;height:210px;border-radius:50%;overflow:hidden;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.13);">
          <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCFH_lF4HwOYfS98wthpleQfHkcwXD5jCj6VQCj006Mba1WsAQ81R3bKHvwxvYe0SKnFgkaVp4_es4aEAX505X4trOUr1xw9gZrDeX7ZdvrLcm8v3fOoTfKh_hfhYGu-TeTjlpBUYFxEqH-NghOXfx4Sde_lq93QLQ7cBZFAulgbU0fYgVHrJ1PM7TvJeXN0ZEWxoSLLxX6Hf_2mA2uvs_t0Rwd1X5TjHR60K7pgrrXV8f_PW9e7yEFycjt4l07E4WF5LfhnxszQwAL" style="width:100%;height:100%;object-fit:cover;opacity:.88;" alt=""/>
        </div>
      </div>
      <div style="text-align:center;margin-bottom:28px;">
        <p class="t-title" style="margin-bottom:14px;">我在，想和我聊点什么？</p>
        <div style="display:flex;gap:8px;justify-content:center;"><span class="chip chip-g">主动问候</span><span class="chip chip-o">日常陪伴</span></div>
      </div>
      <div style="width:100%;position:relative;margin-bottom:18px;">
        <input type="text" placeholder="输入消息…" style="width:100%;background:#fff;border:1px solid #e6e2dc;border-radius:99px;padding:14px 52px 14px 22px;font-size:15px;color:#1c1c18;outline:none;font-family:'Noto Sans SC',sans-serif;"/>
        <span class="mi mi-f" style="position:absolute;right:18px;top:50%;transform:translateY(-50%);color:#596059;font-size:20px;">send</span>
      </div>
      <button style="width:70px;height:70px;border-radius:50%;background:#596059;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(89,96,89,.32);"><span class="mi mi-f" style="font-size:28px;color:#fff;">mic</span></button>
    </div>
  </div>

  <div id="p1" class="page">
    <div class="pc">
      <div style="padding:26px 0 18px;text-align:center;">
        <span class="t-label">我的</span>
        <p class="t-title" style="margin-top:8px;">陪护关系</p>
        <p class="t-body-sm" style="margin:8px auto 0;max-width:260px;">查看当前可陪伴的数字人、授权关系和提醒设置。</p>
      </div>
      <div class="card-w" style="margin-bottom:14px;">
        <p class="t-body" style="font-weight:600;margin-bottom:4px;">已连接：林先生的数字人</p>
        <p class="t-body-sm">关系：朋友 · 允许主动问候 · 允许语音对话</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:9px;">
        <div class="module-row"><div class="icon-pill"><span class="mi" style="color:#596059;font-size:18px;">favorite</span></div><div><p class="t-body" style="font-weight:600;">陪伴偏好</p><p class="t-body-sm">主动频率、安静时段、纪念日提醒</p></div></div>
        <div class="module-row"><div class="icon-pill"><span class="mi" style="color:#596059;font-size:18px;">lock</span></div><div><p class="t-body" style="font-weight:600;">隐私与授权</p><p class="t-body-sm">查看你被允许访问的内容范围</p></div></div>
        <div class="module-row"><div class="icon-pill"><span class="mi" style="color:#596059;font-size:18px;">support_agent</span></div><div><p class="t-body" style="font-weight:600;">情绪支持</p><p class="t-body-sm">设置哀伤支持与紧急联系人</p></div></div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn on" id="n0" onclick="go(0)"><span class="mi">forum</span><span class="nav-lbl">聊天</span></button>
    <button class="nav-btn" id="n1" onclick="go(1)"><span class="mi">account_circle</span><span class="nav-lbl">我的</span></button>
  </nav>
</div>
<div id="daConsentOverlay" class="da-consent-overlay" style="display:none;"></div>
<div id="toast" class="toast"></div>
<script src="/js/layer-explain.js"></script>
<script src="/js/api-core.js"></script>
<script src="/js/avatar-preset.js"></script>
<script src="/js/profile-center.js"></script>
<script>
let cur = 0;
function go(i) {
  document.getElementById('p'+cur).classList.remove('on');
  document.getElementById('n'+cur).classList.remove('on');
  cur = i;
  document.getElementById('p'+cur).classList.add('on');
  document.getElementById('n'+cur).classList.add('on');
}
</script>
<script src="/js/apps-bridge.js"></script>
</body>
</html>
